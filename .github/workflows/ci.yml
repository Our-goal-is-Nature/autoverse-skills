name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/validate.py
      - run: npx -y skills add . --list
      - name: Isolated install
        env:
          HOME: ${{ runner.temp }}/autoverse-skills-home
        run: |
          mkdir -p "$HOME"
          npx -y skills add . --skill '*' -g -a codex -y --copy
          npx -y skills list -g -a codex

